<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operazione Camaleonte — Dashboard</title>
<style>
:root {
  --bg: #0a0e14;
  --surface: #131820;
  --surface2: #1a1f2b;
  --border: #2a3040;
  --text: #c8ccd4;
  --text2: #8b95a5;
  --accent: #c9a84c;
  --accent2: #e04e2f;
  --green: #3fb950;
  --blue: #58a6ff;
  --purple: #ab7df6;
  --red: #f85149;
  --tag-bg: #1c2533;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
  --radius: 8px;
  --radius-sm: 5px;
  --shadow: 0 2px 12px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100}
.topbar .logo{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:700;letter-spacing:.5px}
.topbar .logo span{color:var(--accent)}.topbar .logo .icon{font-size:1.5rem}
.topbar .quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;padding:0 16px;position:sticky;top:54px;z-index:99}
.tab{padding:12px 18px;cursor:pointer;border:none;background:none;color:var(--text2);font-family:var(--font);font-size:.85rem;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text);background:var(--surface2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .badge{background:var(--accent2);color:#fff;font-size:.7rem;padding:2px 7px;border-radius:10px}
main{padding:20px 24px;flex:1;max-width:1400px;width:100%;margin:0 auto}
.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:all .2s}
.card:hover{border-color:#444}
.card h3{font-size:.95rem;margin-bottom:6px;color:var(--accent)}
.card .meta{font-size:.78rem;color:var(--text2)}
.card .actions{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-card .num{font-size:2.4rem;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:.8rem;color:var(--text2);margin-top:4px}
.btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:var(--font);font-size:.82rem;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#252d3a;border-color:#555}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#dbb854}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.danger:hover{background:#ff6a5e}
.btn.small{padding:4px 10px;font-size:.75rem}
.btn.icon{padding:6px 8px;min-width:32px;justify-content:center}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:4px;font-weight:600}
input,select,textarea{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font);font-size:.85rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:550px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{font-size:1.15rem;margin-bottom:16px;color:var(--accent)}
.modal .btn-row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);color:var(--text2);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:600;background:var(--tag-bg)}
.tag.room{background:#1a3a2a;color:var(--green)}
.tag.object{background:#2a1a3a;color:var(--purple)}
.tag.puzzle{background:#3a2a1a;color:var(--accent)}
.tag.path{background:#1a2a3a;color:var(--blue)}
.flowchart-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-height:400px;overflow:auto;position:relative}
.flow-node{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin:8px;display:inline-block;vertical-align:middle;min-width:140px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.flow-node:hover{border-color:var(--accent)}
.flow-node.start{border-color:var(--green)}
.flow-node.end{border-color:var(--accent2)}
.flow-node .node-title{font-weight:600;font-size:.85rem}
.flow-node .node-sub{font-size:.7rem;color:var(--text2)}
.flow-arrow{display:inline-block;vertical-align:middle;margin:0 8px;color:var(--accent);font-size:1.2rem;font-weight:bold}
.flow-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:12px 0}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.room-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:16px;min-height:180px}
.room-card h3{font-size:.95rem;color:var(--accent);margin-bottom:8px}
.puzzle-in-room{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;margin:4px 0;font-size:.8rem;display:flex;align-items:center;justify-content:space-between}
.object-in-room{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--tag-bg);font-size:.7rem;margin:2px;color:var(--purple)}
.connection-line{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);margin:6px 0;flex-wrap:wrap}
.connection-line .conn-item{background:var(--tag-bg);padding:4px 12px;border-radius:var(--radius-sm);font-size:.8rem}
.connection-line .conn-arrow{color:var(--accent);font-weight:bold}
.schema-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:16px 0}
.schema-block h3{color:var(--accent);margin-bottom:12px;font-size:.95rem}
.schema-step{border-left:3px solid var(--accent);padding:8px 16px;margin:8px 0;background:var(--surface2);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.schema-step .step-title{font-weight:600;font-size:.85rem}
.schema-step .step-detail{font-size:.78rem;color:var(--text2)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#000;padding:12px 20px;border-radius:var(--radius);font-weight:600;font-size:.85rem;z-index:300;animation:fadeIn .3s, fadeOut .3s 2.2s forwards;box-shadow:var(--shadow)}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.search-bar{margin-bottom:16px;max-width:400px}
.empty-state{text-align:center;padding:40px;color:var(--text2)}
.empty-state .icon{font-size:3rem;display:block;margin-bottom:12px}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
@media(max-width:768px){.topbar{flex-direction:column;align-items:flex-start}.tabs{top:90px}main{padding:12px}.cards{grid-template-columns:1fr}.stat-cards{grid-template-columns:repeat(2,1fr)}.map-grid{grid-template-columns:1fr}table{font-size:.72rem}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="icon">🕵️‍♀️</span><span>OPERAZIONE</span> CAMALEONTE</div>
  <div class="quick-actions">
    <button class="btn primary" onclick="exportAll()">📥 Esporta JSON</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">📤 Importa JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAll(event)">
    <button class="btn danger small" onclick="if(confirm('Cancellare TUTTI i dati?'))resetAll()">🗑 Reset</button>
  </div>
</div>
<div class="tabs">
  <button class="tab active" data-page="dashboard">📊 Dashboard</button>
  <button class="tab" data-page="stanze">🚪 Stanze <span class="badge" id="badge-stanze">0</span></button>
  <button class="tab" data-page="oggetti">🔦 Oggetti <span class="badge" id="badge-oggetti">0</span></button>
  <button class="tab" data-page="enigmi">🧩 Enigmi <span class="badge" id="badge-enigmi">0</span></button>
  <button class="tab" data-page="percorsi">🗺 Percorsi <span class="badge" id="badge-percorsi">0</span></button>
  <button class="tab" data-page="connessioni">🔗 Connessioni</button>
  <button class="tab" data-page="diagramma">🔀 Diagramma</button>
  <button class="tab" data-page="mappa">🏠 Mappa visiva</button>
  <button class="tab" data-page="schema">📋 Schema</button>
</div>
<main></main>
<div id="toast" class="toast" style="display:none"></div>

<script>
const STORAGE_KEY='camaleonte_data';
function getDefaultData(){return{stanze:[{id:'s1',nome:'Stanza A — La Talpa',descrizione:'Stanza di partenza della prima bambina. Contiene la lettera UV, la foto sospetta e il cifrario farfalla.',colore:'#e04e2f'},{id:'s2',nome:'Stanza B — Il Messaggio',descrizione:'Stanza di partenza della seconda bambina. Contiene la lettera UV, il codice serpente e la valigia.',colore:'#58a6ff'},{id:'s3',nome:'Soggiorno — Cassetta Comune',descrizione:'Stanza finale dove le bambine si ritrovano per aprire la cassetta comune.',colore:'#c9a84c'}],oggetti:[{id:'o1',nome:'Torcia UV (Stanza A)',tipo:'torcia_uv',descrizione:'Torcia a luce ultravioletta per rivelare messaggi nascosti.',stanzaId:'s1'},{id:'o2',nome:'Torcia UV (Stanza B)',tipo:'torcia_uv',descrizione:'Torcia a luce ultravioletta per rivelare messaggi nascosti.',stanzaId:'s2'},{id:'o3',nome:'Lettera Agente Camaleonte (A)',tipo:'documento',descrizione:'Lettera con messaggio UV nascosto: numeri 3-15-13-5-20-1 = COMETA.',stanzaId:'s1'},{id:'o4',nome:'Lettera Agente Camaleonte (B)',tipo:'documento',descrizione:'Lettera con messaggio UV nascosto: Codice Serpente.',stanzaId:'s2'},{id:'o5',nome:'Foto 4 agenti + sagoma',tipo:'foto',descrizione:'Fotografia con 4 volti e sagoma trasparente da sovrapporre.',stanzaId:'s1'},{id:'o6',nome:'Falso dizionario (contenitore)',tipo:'contenitore',descrizione:'Scatola a forma di dizionario, cavo all\'interno.',stanzaId:'s1'},{id:'o7',nome:'Griglia cifrario farfalla',tipo:'documento',descrizione:'Cifrario a farfalla con frase cifrata GZMP RH ZGV.',stanzaId:'s1'},{id:'o8',nome:'Barattolo perline colorate',tipo:'contenitore',descrizione:'Barattolo con perline rosse, verdi, blu. Due blu con numeri incisi 4 e 1.',stanzaId:'s1'},{id:'o9',nome:'Strisce Codice Serpente',tipo:'documento',descrizione:'Serpenti da ritagliare e sovrapporre alla griglia.',stanzaId:'s2'},{id:'o10',nome:'Griglia lettere 5x5',tipo:'documento',descrizione:'Griglia su cui sovrapporre i serpenti per decifrare VALIGIA.',stanzaId:'s2'},{id:'o11',nome:'Valigia con lucchetto 0-12',tipo:'contenitore',descrizione:'Valigia chiusa con lucchetto speciale (9 poi 12).',stanzaId:'s2'},{id:'o12',nome:'Scatola punti colorati',tipo:'contenitore',descrizione:'Scatola con punti colorati e legenda colori.',stanzaId:'s2'},{id:'o13',nome:'Cassetta comune finale',tipo:'cassaforte',descrizione:'Cassetta con lucchetto a parola.',stanzaId:'s3'},{id:'o14',nome:'Buste AIUTO (Stanza A)',tipo:'aiuto',descrizione:'Buste sigillate con tre livelli di aiuto.',stanzaId:'s1'},{id:'o15',nome:'Buste AIUTO (Stanza B)',tipo:'aiuto',descrizione:'Buste sigillate con tre livelli di aiuto.',stanzaId:'s2'},{id:'o16',nome:'Pezzo mappa (A)',tipo:'documento',descrizione:'Prima metà della mappa strappata.',stanzaId:'s1'},{id:'o17',nome:'Pezzo mappa (B)',tipo:'documento',descrizione:'Seconda metà della mappa strappata.',stanzaId:'s2'},{id:'o18',nome:'Lente di ingrandimento',tipo:'strumento',descrizione:'Per leggere i numeri incisi sulle perline.',stanzaId:'s1'}],enigmi:[{id:'e1',nome:'Messaggio UV — COMETA',descrizione:'Lettera con numeri UV: 3-15-13-5-20-1 = COMETA. Aprire con torcia UV.',soluzione:'COMETA',difficolta:'media',stanzaId:'s1',percorsoId:'p1',suggerimenti:['La luce rivela ciò che l\'ombra nasconde','A=1, B=2, C=3...','I numeri formano il nome in codice: COMETA']},{id:'e2',nome:'Foto + Sagoma — Armadietto 7',descrizione:'Sovrapporre sagoma a foto, trovare armadietto 7.',soluzione:'Armadietto 7',difficolta:'facile',stanzaId:'s1',percorsoId:'p1',suggerimenti:['Prova a sovrapporre la sagoma alla foto','Il numero è sull\'armadietto giusto']},{id:'e3',nome:'Cifrario Farfalla — BLU E DUE',descrizione:'Decifrare GZMP RH ZGV con cifrario a farfalla = BLU E DUE.',soluzione:'BLU E DUE',difficolta:'difficile',stanzaId:'s1',percorsoId:'p1',suggerimenti:['Il cifrario a farfalla accoppia lettere simmetriche','GZMP RH ZGV = BLU E DUE','Prendi le 2 perline blu: i numeri sono 4 e 1']},{id:'e4',nome:'Codice Serpente — VALIGIA',descrizione:'Ritagliare serpenti e sovrapporre alla griglia per leggere VALIGIA.',soluzione:'VALIGIA',difficolta:'media',stanzaId:'s2',percorsoId:'p2',suggerimenti:['Ritaglia i serpenti e sovrapponili alla griglia','Le lettere attraversate formano una parola']},{id:'e5',nome:'Lucchetto 9-12',descrizione:'Aprire lucchetto speciale: prima 9 poi 12.',soluzione:'9 poi 12',difficolta:'facile',stanzaId:'s2',percorsoId:'p2',suggerimenti:['La ghiera va da 0 a 12','Prima ruota su 9, poi su 12']},{id:'e6',nome:'Colori doppi — 3 e 7',descrizione:'Contare colori che appaiono esattamente 2 volte: verde e giallo. Legenda: verde=3, giallo=7.',soluzione:'37',difficolta:'media',stanzaId:'s2',percorsoId:'p2',suggerimenti:['Conta quante volte appare ogni colore','Verde=2 volte, Giallo=2 volte','Verde=3, Giallo=7 - codice 37']},{id:'e7',nome:'Mappa unita + Parola finale',descrizione:'Unire i due pezzi di mappa e trovare parola combinazione per cassetta comune.',soluzione:'CAMALEONTE',difficolta:'difficile',stanzaId:'s3',percorsoId:'p3',suggerimenti:['Unisci i due pezzi di mappa','La talpa + il messaggio = la salvezza','La parola è il nome dell\'agente: CAMALEONTE']}],percorsi:[{id:'p1',nome:'Percorso Stanza A',descrizione:'Percorso completo della Stanza A: UV, foto, cifrario, perline.',stanzaId:'s1',enigmaIds:['e1','e2','e3']},{id:'p2',nome:'Percorso Stanza B',descrizione:'Percorso completo della Stanza B: serpenti, lucchetto, colori.',stanzaId:'s2',enigmaIds:['e4','e5','e6']},{id:'p3',nome:'Percorso Finale Comune',descrizione:'Fase finale: mappa unita, cassetta comune.',stanzaId:'s3',enigmaIds:['e7']}],connessioni:[{id:'c1',oggettoId:'o1',enigmaId:'e1',nota:'Torcia UV serve per enigma messaggio nascosto'},{id:'c2',oggettoId:'o3',enigmaId:'e1',nota:'Lettera contiene il messaggio UV'},{id:'c3',oggettoId:'o5',enigmaId:'e2',nota:'Foto e sagoma per trovare armadietto'},{id:'c4',oggettoId:'o6',enigmaId:'e2',nota:'Dizionario nell\'armadietto 7'},{id:'c5',oggettoId:'o7',enigmaId:'e3',nota:'Cifrario per decifrare BLU E DUE'},{id:'c6',oggettoId:'o8',enigmaId:'e3',nota:'Perline blu con numeri 4 e 1'},{id:'c7',oggettoId:'o2',enigmaId:'e4',nota:'Torcia UV per stanza B'},{id:'c8',oggettoId:'o9',enigmaId:'e4',nota:'Strisce serpente da ritagliare'},{id:'c9',oggettoId:'o10',enigmaId:'e4',nota:'Griglia lettere per decifrare'},{id:'c10',oggettoId:'o11',enigmaId:'e5',nota:'Valigia da aprire con lucchetto 9 poi 12'},{id:'c11',oggettoId:'o12',enigmaId:'e6',nota:'Scatola colori per codice 3-7'},{id:'c12',oggettoId:'o13',enigmaId:'e7',nota:'Cassetta finale da aprire'},{id:'c13',oggettoId:'o16',enigmaId:'e7',nota:'Primo pezzo mappa'},{id:'c14',oggettoId:'o17',enigmaId:'e7',nota:'Secondo pezzo mappa'}]}}
function loadData(){const raw=localStorage.getItem(STORAGE_KEY);if(raw){try{return JSON.parse(raw)}catch(e){}}return getDefaultData()}
function saveData(data){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
let DATA=loadData();if(!localStorage.getItem(STORAGE_KEY)){saveData(DATA)}
function persist(){saveData(DATA);refreshUI()}
function genId(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';t.style.animation='none';void t.offsetWidth;t.style.animation='fadeIn .3s, fadeOut .3s 2.2s forwards';setTimeout(()=>{t.style.display='none'},2600)}
function openModal(title,contentHtml,onSave){const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML='<div class="modal"><h2>'+title+'</h2><div class="modal-body">'+contentHtml+'</div><div class="btn-row"><button class="btn cancel">Annulla</button><button class="btn primary save">Salva</button></div></div>';document.body.appendChild(overlay);overlay.querySelector('.cancel').onclick=()=>overlay.remove();overlay.querySelector('.save').onclick=()=>{const result=onSave(overlay.querySelector('.modal-body'));if(result!==false){overlay.remove();persist();showToast('✅ Salvato!')}};overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()})}
function confirmDelete(msg,cb){if(confirm(msg)){cb();persist();showToast('🗑 Eliminato!')}}
function navigate(pageName){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));const tab=document.querySelector('[data-page="'+pageName+'"]');if(tab)tab.classList.add('active');renderPage(pageName)}
document.querySelector('.tabs').addEventListener('click',(e)=>{const tab=e.target.closest('.tab');if(tab)navigate(tab.dataset.page)})
function refreshUI(){const active=document.querySelector('.tab.active');if(active)renderPage(active.dataset.page);updateBadges()}
function updateBadges(){document.getElementById('badge-stanze').textContent=DATA.stanze.length;document.getElementById('badge-oggetti').textContent=DATA.oggetti.length;document.getElementById('badge-enigmi').textContent=DATA.enigmi.length;document.getElementById('badge-percorsi').textContent=DATA.percorsi.length}
function getStanza(id){return DATA.stanze.find(s=>s.id===id)}
function getOggetto(id){return DATA.oggetti.find(o=>o.id===id)}
function getEnigma(id){return DATA.enigmi.find(e=>e.id===id)}
function getPercorso(id){return DATA.percorsi.find(p=>p.id===id)}
function selectOptions(list,selectedId,placeholder){placeholder=placeholder||'— Seleziona —';return'<option value="">'+placeholder+'</option>'+list.map(item=>'<option value="'+item.id+'" '+(item.id===selectedId?'selected':'')+'>'+item.nome+'</option>').join('')}
const TIPI_OGGETTO=['torcia_uv','documento','contenitore','foto','cassaforte','aiuto','strumento','lucchetto','mappa','valigia','decorazione','altro'];
const DIFFICOLTA=['facile','media','difficile','esperto'];

function renderPage(name){const main=document.querySelector('main');switch(name){case'dashboard':renderDashboard(main);break;case'stanze':renderStanze(main);break;case'oggetti':renderOggetti(main);break;case'enigmi':renderEnigmi(main);break;case'percorsi':renderPercorsi(main);break;case'connessioni':renderConnessioni(main);break;case'diagramma':renderDiagramma(main);break;case'mappa':renderMappa(main);break;case'schema':renderSchema(main);break}updateBadges()}

// DASHBOARD
function renderDashboard(main){const nS=DATA.stanze.length,nO=DATA.oggetti.length,nE=DATA.enigmi.length,nP=DATA.percorsi.length,nC=DATA.connessioni.length;main.innerHTML='<h2 style="margin-bottom:20px;font-size:1.1rem;color:var(--accent)">📊 Dashboard — Operazione Camaleonte</h2><div class="stat-cards"><div class="stat-card"><div class="num">'+nS+'</div><div class="lbl">🚪 Stanze</div></div><div class="stat-card"><div class="num">'+nO+'</div><div class="lbl">🔦 Oggetti</div></div><div class="stat-card"><div class="num">'+nE+'</div><div class="lbl">🧩 Enigmi</div></div><div class="stat-card"><div class="num">'+nP+'</div><div class="lbl">🗺 Percorsi</div></div><div class="stat-card"><div class="num">'+nC+'</div><div class="lbl">🔗 Connessioni</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="card"><h3>🚀 Azioni rapide</h3><div class="actions"><button class="btn primary" onclick="navigate(\'stanze\');setTimeout(()=>openModalStanza(),100)">+ Nuova Stanza</button><button class="btn primary" onclick="navigate(\'oggetti\');setTimeout(()=>openModalOggetto(),100)">+ Nuovo Oggetto</button><button class="btn primary" onclick="navigate(\'enigmi\');setTimeout(()=>openModalEnigma(),100)">+ Nuovo Enigma</button><button class="btn" onclick="navigate(\'connessioni\')">🔗 Gestisci Connessioni</button></div></div><div class="card"><h3>📋 Riepilogo Percorsi</h3>'+DATA.percorsi.map(p=>{const s=getStanza(p.stanzaId);return'<div style="margin:4px 0;font-size:.85rem">🗺 <b>'+p.nome+'</b> — '+(s?s.nome:'?')+' ('+p.enigmaIds.length+' enigmi)</div>'}).join('')+'</div></div><div class="card" style="margin-top:16px"><h3>📝 Stato preparazione</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:10px">'+DATA.stanze.map(s=>{const oggettiCount=DATA.oggetti.filter(o=>o.stanzaId===s.id).length;const enigmiCount=DATA.enigmi.filter(e=>e.stanzaId===s.id).length;return'<div style="background:var(--surface2);padding:10px;border-radius:var(--radius-sm);font-size:.8rem"><b>'+s.nome+'</b><br>🔦 '+oggettiCount+' oggetti &nbsp; 🧩 '+enigmiCount+' enigmi</div>'}).join('')+'</div></div><div class="card" style="margin-top:16px"><h3>💾 Dati salvati in locale</h3><p style="font-size:.8rem;color:var(--text2)">I dati vengono salvati automaticamente nel localStorage del browser. Usa i pulsanti in alto per esportare/importare in JSON.</p><button class="btn" onclick="exportAll()">📥 Scarica backup JSON</button></div>'}

// STANZE
function renderStanze(main){main.innerHTML='<h2 style="margin-bottom:16px;font-size:1.1rem">🚪 Gestione Stanze</h2><button class="btn primary" onclick="openModalStanza()">+ Nuova Stanza</button><div class="cards" style="margin-top:16px">'+DATA.stanze.map(s=>'<div class="card" style="border-left:4px solid '+(s.colore||'#555')+'"><h3>🚪 '+s.nome+'</h3><div class="meta">'+(s.descrizione||'Nessuna descrizione')+'</div><div class="meta" style="margin-top:6px">Oggetti: '+DATA.oggetti.filter(o=>o.stanzaId===s.id).length+' | Enigmi: '+DATA.enigmi.filter(e=>e.stanzaId===s.id).length+'</div><div class="actions"><button class="btn small" onclick="openModalStanza(\''+s.id+'\')">✏️ Modifica</button><button class="btn danger small" onclick="confirmDelete(\'Eliminare stanza «'+s.nome+'»?\',()=>{DATA.stanze=DATA.stanze.filter(x=>x.id!==\''+s.id+'\');DATA.oggetti.forEach(o=>{if(o.stanzaId===\''+s.id+'\')o.stanzaId=\'\'});DATA.enigmi.forEach(e=>{if(e.stanzaId===\''+s.id+'\')e.stanzaId=\'\'});DATA.percorsi=DATA.percorsi.filter(x=>x.stanzaId!==\''+s.id+'\')})">🗑</button></div></div>').join('')||'<div class="empty-state"><span class="icon">🚪</span>Nessuna stanza. Crea la prima!</div>'+'</div>'}
function openModalStanza(id){const s=id?getStanza(id):null;const title=s?'Modifica Stanza':'Nuova Stanza';const nome=s?s.nome:'';const descrizione=s?s.descrizione:'';const colore=s?s.colore:'#c9a84c';openModal(title,'<div class="form-group"><label>Nome stanza</label><input id="mf-nome" value="'+nome.replace(/"/g,'&quot;')+'" placeholder="es. Stanza A — La Talpa"></div><div class="form-group"><label>Descrizione</label><textarea id="mf-desc">'+descrizione.replace(/"/g,'&quot;')+'</textarea></div><div class="form-group"><label>Colore (bordo)</label><input type="color" id="mf-colore" value="'+colore+'" style="width:80px;padding:4px"></div>',(body)=>{const nomeVal=body.querySelector('#mf-nome').value.trim();if(!nomeVal){showToast('⚠️ Il nome è obbligatorio');return false}if(s){s.nome=nomeVal;s.descrizione=body.querySelector('#mf-desc').value;s.colore=body.querySelector('#mf-colore').value}else{DATA.stanze.push({id:genId('s'),nome:nomeVal,descrizione:body.querySelector('#mf-desc').value,colore:body.querySelector('#mf-colore').value})}})}

// OGGETTI
function renderOggetti(main){main.innerHTML='<h2 style="margin-bottom:16px;font-size:1.1rem">🔦 Gestione Oggetti</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn primary" onclick="openModalOggetto()">+ Nuovo Oggetto</button><select id="filter-tipo" class="btn" style="width:auto" onchange="renderOggetti(document.querySelector(\'main\'))"><option value="">Tutti i tipi</option>'+TIPI_OGGETTO.map(t=>'<option value="'+t+'">'+t+'</option>').join('')+'</select><select id="filter-stanza-oggetti" class="btn" style="width:auto" onchange="renderOggetti(document.querySelector(\'main\'))"><option value="">Tutte le stanze</option>'+DATA.stanze.map(s=>'<option value="'+s.id+'">'+s.nome+'</option>').join('')+'</select></div><div class="cards">'+DATA.oggetti.filter(o=>{const ft=document.getElementById('filter-tipo');const fs=document.getElementById('filter-stanza-oggetti');if(ft&&ft.value&&o.tipo!==ft.value)return false;if(fs&&fs.value&&o.stanzaId!==fs.value)return false;return true}).map(o=>{const s=getStanza(o.stanzaId);return'<div class="card"><h3>🔦 '+o.nome+'</h3><span class="tag object">'+(o.tipo||'altro')+'</span><div class="meta">'+(o.descrizione||'')+'</div><div class="meta">📍 '+(s?s.nome:'Nessuna stanza')+'</div><div class="actions"><button class="btn small" onclick="openModalOggetto(\''+o.id+'\')">✏️</button><button class="btn danger small" onclick="confirmDelete(\'Eliminare «'+o.nome+'»?\',()=>{DATA.oggetti=DATA.oggetti.filter(x=>x.id!==\''+o.id+'\');DATA.connessioni=DATA.connessioni.filter(c=>c.oggettoId!==\''+o.id+'\')})">🗑</button></div></div>'}).join('')||'<div class="empty-state"><span class="icon">🔦</span>Nessun oggetto</div>'+'</div>'}
function openModalOggetto(id){const o=id?getOggetto(id):null;const title=o?'Modifica Oggetto':'Nuovo Oggetto';openModal(title,'<div class="form-group"><label>Nome oggetto</label><input id="mf-nome" value="'+(o?o.nome.replace(/"/g,'&quot;'):'')+'" placeholder="es. Torcia UV"></div><div class="form-group"><label>Tipo</label><select id="mf-tipo">'+TIPI_OGGETTO.map(t=>'<option value="'+t+'" '+(o&&o.tipo===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="form-group"><label>Descrizione</label><textarea id="mf-desc">'+(o?(o.descrizione||'').replace(/"/g,'&quot;'):'')+'</textarea></div><div class="form-group"><label>Stanza</label><select id="mf-stanza">'+selectOptions(DATA.stanze,o?o.stanzaId:'','— Nessuna —')+'</select></div>',(body)=>{const nomeVal=body.querySelector('#mf-nome').value.trim();if(!nomeVal){showToast('⚠️ Il nome è obbligatorio');return false}const obj={nome:nomeVal,tipo:body.querySelector('#mf-tipo').value,descrizione:body.querySelector('#mf-desc').value,stanzaId:body.querySelector('#mf-stanza').value||''};if(o){Object.assign(o,obj)}else{DATA.oggetti.push({id:genId('o'),...obj})}})}

// ENIGMI
function renderEnigmi(main){main.innerHTML='<h2 style="margin-bottom:16px;font-size:1.1rem">🧩 Gestione Enigmi</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn primary" onclick="openModalEnigma()">+ Nuovo Enigma</button><select id="filter-stanza-enigmi" class="btn" style="width:auto" onchange="renderEnigmi(document.querySelector(\'main\'))"><option value="">Tutte le stanze</option>'+DATA.stanze.map(s=>'<option value="'+s.id+'">'+s.nome+'</option>').join('')+'</select><select id="filter-diff" class="btn" style="width:auto" onchange="renderEnigmi(document.querySelector(\'main\'))"><option value="">Tutte le difficoltà</option>'+DIFFICOLTA.map(d=>'<option value="'+d+'">'+d+'</option>').join('')+'</select></div><div class="cards">'+DATA.enigmi.filter(e=>{const fs=document.getElementById('filter-stanza-enigmi');const fd=document.getElementById('filter-diff');if(fs&&fs.value&&e.stanzaId!==fs.value)return false;if(fd&&fd.value&&e.difficolta!==fd.value)return false;return true}).map(e=>{const s=getStanza(e.stanzaId);const p=getPercorso(e.percorsoId);return'<div class="card"><h3>🧩 '+e.nome+'</h3><span class="tag puzzle">'+(e.difficolta||'?')+'</span><div class="meta">'+(e.descrizione||'')+'</div><div class="meta">🔑 Soluzione: <b>'+(e.soluzione||'?')+'</b></div><div class="meta">📍 '+(s?s.nome:'?')+' &nbsp;|&nbsp; 🗺 '+(p?p.nome:'?')+'</div><div class="meta">💡 '+(e.suggerimenti?e.suggerimenti.length:0)+' suggerimenti</div><div class="actions"><button class="btn small" onclick="openModalEnigma(\''+e.id+'\')">✏️</button><button class="btn danger small" onclick="confirmDelete(\'Eliminare «'+e.nome+'»?\',()=>{DATA.enigmi=DATA.enigmi.filter(x=>x.id!==\''+e.id+'\');DATA.percorsi.forEach(p=>{p.enigmaIds=p.enigmaIds.filter(eid=>eid!==\''+e.id+'\')});DATA.connessioni=DATA.connessioni.filter(c=>c.enigmaId!==\''+e.id+'\')})">🗑</button></div></div>'}).join('')||'<div class="empty-state"><span class="icon">🧩</span>Nessun enigma</div>'+'</div>'}
function openModalEnigma(id){const e=id?getEnigma(id):null;const title=e?'Modifica Enigma':'Nuovo Enigma';const sugg=e?(e.suggerimenti||[]).join('\n'):'';openModal(title,'<div class="form-group"><label>Nome enigma</label><input id="mf-nome" value="'+(e?e.nome.replace(/"/g,'&quot;'):'')+'" placeholder="es. Messaggio UV"></div><div class="form-group"><label>Descrizione</label><textarea id="mf-desc">'+(e?(e.descrizione||'').replace(/"/g,'&quot;'):'')+'</textarea></div><div class="form-group"><label>Soluzione</label><input id="mf-soluzione" value="'+(e?e.soluzione.replace(/"/g,'&quot;'):'')+'" placeholder="es. COMETA"></div><div class="form-group"><label>Difficoltà</label><select id="mf-diff">'+DIFFICOLTA.map(d=>'<option value="'+d+'" '+(e&&e.difficolta===d?'selected':'')+'>'+d+'</option>').join('')+'</select></div><div class="form-group"><label>Stanza</label><select id="mf-stanza">'+selectOptions(DATA.stanze,e?e.stanzaId:'')+'</select></div><div class="form-group"><label>Percorso</label><select id="mf-percorso">'+selectOptions(DATA.percorsi,e?e.percorsoId:'','— Nessuno —')+'</select></div><div class="form-group"><label>Suggerimenti (uno per riga)</label><textarea id="mf-sugg" rows="4">'+sugg.replace(/"/g,'&quot;')+'</textarea></div>',(body)=>{const nomeVal=body.querySelector('#mf-nome').value.trim();if(!nomeVal){showToast('⚠️ Il nome è obbligatorio');return false}const enigma={nome:nomeVal,descrizione:body.querySelector('#mf-desc').value,soluzione:body.querySelector('#mf-soluzione').value,difficolta:body.querySelector('#mf-diff').value,stanzaId:body.querySelector('#mf-stanza').value||'',percorsoId:body.querySelector('#mf-percorso').value||'',suggerimenti:body.querySelector('#mf-sugg').value.split('\n').filter(s=>s.trim())};if(e){Object.assign(e,enigma)}else{DATA.enigmi.push({id:genId('e'),...enigma})}})}

// PERCORSI
function renderPercorsi(main){main.innerHTML='<h2 style="margin-bottom:16px;font-size:1.1rem">🗺 Gestione Percorsi</h2><button class="btn primary" onclick="openModalPercorso()">+ Nuovo Percorso</button><div class="cards" style="margin-top:16px">'+DATA.percorsi.map(p=>{const s=getStanza(p.stanzaId);const enigmi=p.enigmaIds.map(id=>getEnigma(id)).filter(Boolean);return'<div class="card"><h3>🗺 '+p.nome+'</h3><span class="tag path">'+(s?s.nome:'?')+'</span><div class="meta">'+(p.descrizione||'')+'</div><div class="meta" style="margin-top:6px">🧩 Enigmi: <b>'+enigmi.length+'</b></div><ol style="font-size:.78rem;margin:8px 0 0 16px;color:var(--text2)">'+enigmi.map(e=>'<li>'+e.nome+' <span class="tag puzzle">'+e.difficolta+'</span></li>').join('')+'</ol><div class="actions"><button class="btn small" onclick="openModalPercorso(\''+p.id+'\')">✏️</button><button class="btn danger small" onclick="confirmDelete(\'Eliminare percorso «'+p.nome+'»?\',()=>{DATA.percorsi=DATA.percorsi.filter(x=>x.id!==\''+p.id+'\');DATA.enigmi.forEach(e=>{if(e.percorsoId===\''+p.id+'\')e.percorsoId=\'\'})})">🗑</button></div></div>'}).join('')||'<div class="empty-state"><span class="icon">🗺</span>Nessun percorso</div>'+'</div>'}
function openModalPercorso(id){const p=id?getPercorso(id):null;const title=p?'Modifica Percorso':'Nuovo Percorso';const enigmiStanza=(p&&p.stanzaId)?DATA.enigmi.filter(e=>e.stanzaId===p.stanzaId):DATA.enigmi;openModal(title,'<div class="form-group"><label>Nome percorso</label><input id="mf-nome" value="'+(p?p.nome.replace(/"/g,'&quot;'):'')+'" placeholder="es. Percorso Stanza A"></div><div class="form-group"><label>Descrizione</label><textarea id="mf-desc">'+(p?(p.descrizione||'').replace(/"/g,'&quot;'):'')+'</textarea></div><div class="form-group"><label>Stanza</label><select id="mf-stanza" onchange="updatePercorsoEnigmi()">'+selectOptions(DATA.stanze,p?p.stanzaId:'')+'</select></div><div class="form-group"><label>Enigmi (in ordine)</label><div id="enigmi-checklist" style="max-height:200px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px">'+enigmiStanza.map(e=>'<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.82rem;cursor:pointer"><input type="checkbox" value="'+e.id+'" '+(p&&p.enigmaIds.includes(e.id)?'checked':'')+' style="width:auto"> '+e.nome+' <span class="tag puzzle">'+e.difficolta+'</span></label>').join('')||'<span style="color:var(--text2);font-size:.8rem">Nessun enigma in questa stanza</span>'+'</div></div>',(body)=>{const nomeVal=body.querySelector('#mf-nome').value.trim();if(!nomeVal){showToast('⚠️ Il nome è obbligatorio');return false}const checked=[...body.querySelectorAll('#enigmi-checklist input:checked')].map(i=>i.value);const percorso={nome:nomeVal,descrizione:body.querySelector('#mf-desc').value,stanzaId:body.querySelector('#mf-stanza').value||'',enigmaIds:checked};if(p){Object.assign(p,percorso)}else{DATA.percorsi.push({id:genId('p'),...percorso})}})}

// CONNESSIONI
function renderConnessioni(main){main.innerHTML='<h2 style="margin-bottom:16px;font-size:1.1rem">🔗 Connessioni Oggetti ↔ Enigmi</h2><button class="btn primary" onclick="openModalConnessione()">+ Nuova Connessione</button><div style="margin-top:16px">'+DATA.connessioni.map(c=>{const o=getOggetto(c.oggettoId);const e=getEnigma(c.enigmaId);return'<div class="connection-line"><span class="conn-item" style="color:var(--purple)">🔦 '+(o?o.nome:'???')+'</span><span class="conn-arrow">→</span><span class="conn-item" style="color:var(--accent)">🧩 '+(e?e.nome:'???')+'</span><span style="font-size:.75rem;color:var(--text2);flex:1">'+(c.nota||'')+'</span><button class="btn danger small" onclick="confirmDelete(\'Rimuovere connessione?\',()=>{DATA.connessioni=DATA.connessioni.filter(x=>x.id!==\''+c.id+'\')})">🗑</button></div>'}).join('')||'<div class="empty-state"><span class="icon">🔗</span>Nessuna connessione</div>'+'</div>'}
function openModalConnessione(){openModal('Nuova Connessione','<div class="form-group"><label>Oggetto</label><select id="mf-oggetto">'+selectOptions(DATA.oggetti,'')+'</select></div><div class="form-group"><label>Enigma</label><select id="mf-enigma">'+selectOptions(DATA.enigmi,'')+'</select></div><div class="form-group"><label>Nota (es. "serve per decifrare il codice")</label><input id="mf-nota" placeholder="Descrizione collegamento"></div>',(body)=>{const oid=body.querySelector('#mf-oggetto').value;const eid=body.querySelector('#mf-enigma').value;if(!oid||!eid){showToast('⚠️ Seleziona oggetto e enigma');return false}DATA.connessioni.push({id:genId('c'),oggettoId:oid,enigmaId:eid,nota:body.querySelector('#mf-nota').value})})}

// DIAGRAMMA DI FLUSSO
function renderDiagramma(main){const renderPathFlow=(p)=>{const enigmi=p.enigmaIds.map(id=>getEnigma(id)).filter(Boolean);const s=getStanza(p.stanzaId);return'<div style="margin:8px 0;font-size:.8rem;color:var(--accent);font-weight:600">🗺 '+p.nome+' '+(s?'— '+s.nome:'')+'</div><div class="flow-row"><div class="flow-node start"><div class="node-title">🚪 INIZIO</div><div class="node-sub">'+(s?s.nome:'')+'</div></div>'+enigmi.map((e,i)=>'<span class="flow-arrow">→</span><div class="flow-node" onclick="navigate(\'enigmi\')" title="'+(e.descrizione||'')+'&#10;Soluzione: '+(e.soluzione||'')+'"><div class="node-title">🧩 '+e.nome+'</div><div class="node-sub">'+e.difficolta+' | Sol: '+(e.soluzione||'?')+'</div></div>').join('')+'<span class="flow-arrow">→</span><div class="flow-node end"><div class="node-title">🏁 USCITA</div><div class="node-sub">Prossima fase</div></div></div>'};main.innerHTML='<h2 style="margin-bottom:16px;font-size:1.1rem">🔀 Diagramma di Flusso</h2><div class="flowchart-container"><h3 style="color:var(--text2);margin-bottom:16px">Flusso completo del gioco</h3>'+DATA.percorsi.map(p=>renderPathFlow(p)).join('<hr>')+(DATA.percorsi.length>1?'<hr><div style="text-align:center;margin:16px 0"><div class="flow-node end" style="font-size:1rem"><div class="node-title">🔓 CASSETTA COMUNE</div><div class="node-sub">I due percorsi si uniscono → apertura finale</div></div></div><div class="flow-row" style="justify-content:center"><span class="flow-arrow">→</span><div class="flow-node end" style="font-size:1.1rem"><div class="node-title">🎁 LETTERA + REGALO</div><div class="node-sub">Rivelazione: Camaleonte vi ha messe alla prova!</div></div></div>':'')+'</div><div class="card" style="margin-top:16px"><h3>⏱ Timeline stimata</h3>'+DATA.percorsi.map(p=>{const enigmi=p.enigmaIds.map(id=>getEnigma(id)).filter(Boolean);const minuti=enigmi.length*7;return'<div class="schema-step"><span class="step-title">'+p.nome+'</span> <span class="step-detail">~'+minuti+' min ('+enigmi.length+' enigmi × ~7 min)</span></div>'}).join('')+'<div class="schema-step" style="border-left-color:var(--accent2)"><span class="step-title">Fase comune finale</span> <span class="step-detail">~15 min</span></div><div style="margin-top:8px;font-weight:600;color:var(--accent)">⏱ TOTALE: ~'+(DATA.percorsi.reduce((acc,p)=>acc+(p.enigmaIds.length*7),0)+15)+' minuti</div></div>'}

// MAPPA VISIVA
function renderMappa(main){main.innerHTML='<h2 style="margin-bottom:16px;font-size:1.1rem">🏠 Mappa Visiva — Stanze e Contenuti</h2><div class="map-grid">'+DATA.stanze.map(s=>{const oggetti=DATA.oggetti.filter(o=>o.stanzaId===s.id);const enigmi=DATA.enigmi.filter(e=>e.stanzaId===s.id);return'<div class="room-card" style="border-left:4px solid '+(s.colore||'#555')+'"><h3>🚪 '+s.nome+'</h3><div style="font-size:.78rem;color:var(--text2);margin-bottom:8px">'+(s.descrizione||'')+'</div><div style="margin-bottom:8px"><b style="font-size:.78rem;color:var(--purple)">🔦 Oggetti ('+oggetti.length+'):</b>'+oggetti.map(o=>'<span class="object-in-room">'+o.nome+'</span>').join('')+'</div><div><b style="font-size:.78rem;color:var(--accent)">🧩 Enigmi ('+enigmi.length+'):</b>'+enigmi.map(e=>'<div class="puzzle-in-room"><span>🧩 '+e.nome+'</span><span class="tag puzzle">'+e.difficolta+'</span></div>').join('')+'</div></div>'}).join('')||'<div class="empty-state"><span class="icon">🏠</span>Nessuna stanza</div>'+'</div>'}

// SCHEMA RIEPILOGATIVO
function renderSchema(main){let html='<h2 style="margin-bottom:16px;font-size:1.1rem">📋 Schema Riepilogativo — Operazione Camaleonte</h2>';html+='<div class="schema-block"><h3>🎯 Concept</h3><p style="font-size:.85rem;color:var(--text2)">Due bambine, due stanze, due percorsi paralleli. Si riuniscono per la cassetta comune.</p></div>';
DATA.percorsi.forEach(p=>{const s=getStanza(p.stanzaId);const enigmi=p.enigmaIds.map(id=>getEnigma(id)).filter(Boolean);html+='<div class="schema-block"><h3>🗺 '+p.nome+' — '+(s?s.nome:'')+'</h3>';enigmi.forEach((e,i)=>{html+='<div class="schema-step"><span class="step-title">'+(i+1)+'. '+e.nome+'</span><span class="step-detail">🎯 Difficoltà: '+e.difficolta+' | 🔑 Soluzione: <b>'+e.soluzione+'</b></span>';if(e.suggerimenti&&e.suggerimenti.length){html+='<div style="font-size:.75rem;color:var(--text2);margin-top:4px">💡 ';e.suggerimenti.forEach((s,i)=>{html+='['+(i+1)+'] '+s+' '});html+='</div>'}html+='</div>'});const oggettiInStanza=DATA.oggetti.filter(o=>o.stanzaId===p.stanzaId);if(oggettiInStanza.length){html+='<div style="margin-top:8px;font-size:.78rem;color:var(--purple)">🔦 Oggetti: '+oggettiInStanza.map(o=>o.nome).join(', ')+'</div>'}html+='</div>'});
html+='<div class="schema-block" style="border:2px solid var(--accent)"><h3>🎁 Finale — Cassetta Comune</h3><div class="schema-step"><span class="step-title">1. Unione mappa</span><span class="step-detail">Le bambine uniscono i due pezzi di mappa e trovano la posizione della cassetta.</span></div><div class="schema-step"><span class="step-title">2. Parola combinazione</span><span class="step-detail">Combinano gli indizi dai loro percorsi per formare la parola che apre la cassetta.</span></div><div class="schema-step" style="border-left-color:var(--accent2)"><span class="step-title">3. Rivelazione</span><span class="step-detail">Dentro la cassetta: lettera dell\'Agente Camaleonte e regalo finale.</span></div></div>';main.innerHTML=html}

// EXPORT / IMPORT / RESET
function exportAll(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='operazione-camaleonte-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('📥 Backup esportato!')}
function importAll(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){try{const parsed=JSON.parse(e.target.result);if(parsed.stanze&&parsed.oggetti&&parsed.enigmi&&parsed.percorsi){DATA=parsed;persist();showToast('📤 Dati importati con successo!')}else{showToast('⚠️ File JSON non valido')}}catch(err){showToast('⚠️ Errore nel parsing JSON')}};reader.readAsText(file);event.target.value=''}
function resetAll(){DATA=getDefaultData();persist();showToast('🔄 Dati resettati ai valori predefiniti!')}

// INIT
navigate('dashboard');
</script>
</body>
</html>
